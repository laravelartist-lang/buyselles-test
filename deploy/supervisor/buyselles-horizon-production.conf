; Production Supervisor config for Laravel Horizon.
; Server path: /var/www/buyselles
; Install:
;   sudo cp deploy/supervisor/buyselles-horizon-production.conf /etc/supervisor/conf.d/buyselles-horizon.conf
;   sudo supervisorctl stop buyselles-worker:*
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start buyselles-horizon
; After deploy: cd /var/www/buyselles && php artisan horizon:terminate

[program:buyselles-horizon]
process_name=%(program_name)s
command=php /var/www/buyselles/artisan horizon
directory=/var/www/buyselles
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/buyselles/storage/logs/horizon.log
stopwaitsecs=660
