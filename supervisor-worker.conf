; Laravel Horizon — replaces queue:work workers.
; Install: sudo cp supervisor-worker.conf /etc/supervisor/conf.d/buyselles-horizon.conf
; Then:    sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start buyselles-horizon
;
; After deploy: php artisan horizon:terminate

[program:buyselles-horizon]
process_name=%(program_name)s
command=php /home/awais-koder/WorkStation/projects/buyselles_bundle/buyselles/artisan horizon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=awais-koder
numprocs=1
redirect_stderr=true
stdout_logfile=/home/awais-koder/WorkStation/projects/buyselles_bundle/buyselles/storage/logs/horizon.log
stopwaitsecs=660
