name: Build User App (iOS signed IPA)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload to TestFlight after building IPA
        type: boolean
        default: true
      clean_build:
        description: Ignore caches and run a full clean build
        type: boolean
        default: false

concurrency:
  group: flutter-user-app-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: mobile/user_app
  BUNDLE_ID: com.buyselles.app

jobs:
  build-ipa:
    name: Build signed IPA (TestFlight)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Validate signing secrets
        working-directory: ${{ github.workspace }}
        run: |
          missing=0
          required=(BUILD_CERTIFICATE_BASE64 BUILD_PROVISION_PROFILE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD GOOGLE_SERVICE_INFO_PLIST_BASE64)
          if [ "${UPLOAD_TO_TESTFLIGHT}" = "true" ]; then
            required+=(APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID)
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
        env:
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.repository.default_branch }}
          ref: ${{ github.sha }}
          filters: |
            dependencies:
              - 'mobile/user_app/pubspec.yaml'
              - 'mobile/user_app/pubspec.lock'
              - 'mobile/user_app/ios/Podfile'
              - 'mobile/user_app/ios/Podfile.lock'
            app_icon:
              - 'mobile/user_app/ios/Runner/Assets.xcassets/AppIcon.appiconset/**'
            ios_config:
              - 'mobile/user_app/ios/Runner/Info.plist'
              - 'mobile/user_app/ios/Runner.xcodeproj/**'
              - 'mobile/user_app/ios/Runner/Runner.entitlements'
            dart_code:
              - 'mobile/user_app/lib/**'
              - 'mobile/user_app/assets/**'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-user-${{ hashFiles('mobile/user_app/pubspec.lock') }}

      - name: Restore Dart dependency cache
        id: dart_cache
        uses: actions/cache@v4
        with:
          path: |
            mobile/user_app/.dart_tool
            ~/.pub-cache
          key: dart-user-${{ hashFiles('mobile/user_app/pubspec.lock') }}
          restore-keys: |
            dart-user-

      - name: Restore CocoaPods cache
        id: pods_cache
        uses: actions/cache@v4
        with:
          path: |
            mobile/user_app/ios/Pods
            ~/.cocoapods
          key: pods-user-${{ hashFiles('mobile/user_app/ios/Podfile.lock') }}
          restore-keys: |
            pods-user-

      - name: Install dependencies
        if: inputs.clean_build || steps.changes.outputs.dependencies == 'true' || steps.dart_cache.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: Skip Dart dependencies (cache hit)
        if: inputs.clean_build != true && steps.changes.outputs.dependencies != 'true' && steps.dart_cache.outputs.cache-hit == 'true'
        run: echo "Reusing cached Dart dependencies"

      - name: Validate Xcode project and iOS release config
        run: |
          bash tool/verify_ios_release.sh
          xcodebuild -list -project ios/Runner.xcodeproj >/dev/null
          echo "Xcode project validation passed"

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Install Apple signing certificate
        working-directory: ${{ github.workspace }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        id: provision
        working-directory: ${{ github.workspace }}
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_XML="$(security cms -D -i "$PP_PATH")"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$PP_XML")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$PP_XML")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' /dev/stdin <<< "$PP_XML")
          echo "profile_name=${PROFILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "team_id=${TEAM_ID}" >> "$GITHUB_OUTPUT"

      - name: Install Firebase iOS config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode -o ios/GoogleService-Info.plist
          cp ios/GoogleService-Info.plist ios/Runner/GoogleService-Info.plist

      - name: Configure Release manual signing for CI
        env:
          PROFILE_NAME: ${{ steps.provision.outputs.profile_name }}
          TEAM_ID: ${{ steps.provision.outputs.team_id }}
        run: |
          python3 <<'PY'
          import os
          import re

          profile = os.environ["PROFILE_NAME"]
          team_id = os.environ["TEAM_ID"]
          path = "ios/Runner.xcodeproj/project.pbxproj"
          text = open(path, encoding="utf-8").read()
          block_id = "97C147071CF9000F007C117D /* Release */"
          start = text.find(block_id)
          if start == -1:
              raise SystemExit("Release Runner build configuration not found")
          end = text.find("name = Release;", start)
          if end == -1:
              raise SystemExit("Release block end not found")
          end = text.find("};", end) + 2
          block = text[start:end]
          block = re.sub(
              r'CODE_SIGN_IDENTITY = "[^"]*";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";',
              block,
              count=1,
          )
          block = block.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;",
              1,
          )
          block = re.sub(
              r'DEVELOPMENT_TEAM = [^;]+;',
              f'DEVELOPMENT_TEAM = {team_id};',
              block,
              count=1,
          )
          block = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";',
              f'PROVISIONING_PROFILE_SPECIFIER = "{profile}";',
              block,
              count=1,
          )
          text = text[:start] + block + text[end:]
          open(path, "w", encoding="utf-8").write(text)
          PY

      - name: Ensure App Store icon has no alpha channel
        if: inputs.clean_build || steps.changes.outputs.app_icon == 'true'
        run: |
          ICON="ios/Runner/Assets.xcassets/AppIcon.appiconset/1024.png"
          if [ ! -f "$ICON" ]; then
            echo "::warning::App Store icon not found at $ICON — skipping alpha check"
            exit 0
          fi
          if sips -g hasAlpha "$ICON" 2>/dev/null | grep -q 'hasAlpha: yes'; then
            TMP="${RUNNER_TEMP}/appicon1024.jpg"
            sips -s format jpeg "$ICON" --out "$TMP" >/dev/null
            sips -s format png "$TMP" --out "$ICON" >/dev/null
            echo "Removed alpha from 1024.png"
          else
            echo "App Store icon already has no alpha"
          fi

      - name: Skip icon check (unchanged)
        if: inputs.clean_build != true && steps.changes.outputs.app_icon != 'true'
        run: echo "App icon unchanged — skipping alpha check"

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ steps.provision.outputs.team_id }}
          PROFILE_NAME: ${{ steps.provision.outputs.profile_name }}
        run: |
          python3 <<'PY'
          import os
          import plistlib

          data = {
              "method": "app-store",
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {
                  "com.buyselles.app": os.environ["PROFILE_NAME"],
              },
              "uploadSymbols": True,
          }
          with open("ios/ExportOptions.plist", "wb") as handle:
              plistlib.dump(data, handle)
          PY

      - name: Build IPA
        run: |
          BUILD_FLAGS=(--release --export-options-plist=ios/ExportOptions.plist)
          if [ "${CLEAN_BUILD}" != "true" ] && [ "${DEPS_CHANGED}" != "true" ] && [ "${DART_CACHE_HIT}" = "true" ]; then
            BUILD_FLAGS+=(--no-pub)
          fi
          if [ "${PODS_CACHE_HIT}" = "true" ] && [ "${CLEAN_BUILD}" != "true" ] && [ "${DEPS_CHANGED}" != "true" ]; then
            echo "Reusing cached CocoaPods — pod install should be incremental"
          fi
          flutter build ipa "${BUILD_FLAGS[@]}"
        env:
          CLEAN_BUILD: ${{ inputs.clean_build }}
          DEPS_CHANGED: ${{ steps.changes.outputs.dependencies }}
          DART_CACHE_HIT: ${{ steps.dart_cache.outputs.cache-hit }}
          PODS_CACHE_HIT: ${{ steps.pods_cache.outputs.cache-hit }}

      - name: Locate built IPA
        id: ipa
        run: |
          ipa_path="$(ls -1 build/ios/ipa/*.ipa | head -1)"
          pubspec_version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "path=mobile/user_app/${ipa_path}" >> "$GITHUB_OUTPUT"
          echo "version=${pubspec_version}" >> "$GITHUB_OUTPUT"
          echo "Built IPA: mobile/user_app/${ipa_path} (pubspec ${pubspec_version})"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-app-ios-ipa
          path: mobile/user_app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          app-type: ios

      - name: Clean up keychain
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
