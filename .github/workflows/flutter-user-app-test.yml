name: Test User App

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/user_app/**'
      - '.github/workflows/flutter-user-app-test.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/user_app/**'
      - '.github/workflows/flutter-user-app-test.yml'

concurrency:
  group: flutter-user-app-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
