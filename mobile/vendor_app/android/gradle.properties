# Heap limits are deliberately kept below this machine's physical RAM (~7.3 GiB total, which
# already leans on swap). The Flutter template default here was -Xmx8G -XX:MaxMetaspaceSize=4G,
# i.e. more memory than the machine has. Combined with the Kotlin compiler daemon inheriting
# the same values, the Linux OOM killer terminated the daemon mid-build:
#   "Gradle build daemon disappeared unexpectedly (it may have been killed or may have crashed)"
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# A release build additionally runs R8/ProGuard, which needs more headroom than debug. Override
# for that one invocation instead of raising the committed default:
#   ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"

# Without an explicit value the Kotlin compiler daemon inherits org.gradle.jvmargs and runs a
# second full-size JVM alongside the Gradle daemon.
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

# AAPT2, D8/R8 and dexing run in worker processes whose native memory is not bounded by the
# heap limits above, so keep build concurrency modest on this machine.
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true

# Jetifier is deprecated and no dependency in this project uses the legacy
# com.android.support libraries, so it only inflated build times.
android.enableJetifier=false
